<style>
:root{--navy:#0a0a0a;--sky:#1c2af0;--green:#248a3d;--red:#d70015;--amber:#c77700;
 --bg:#f5f5f7;--card:#fff;--line:#e8e8ed;--text:#1d1d1f;--muted:#86868b;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);--radius:18px;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;
 background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.45}
header{background:#0a0a0a;color:#fff;padding:12px 20px;
 display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:60;
 box-shadow:0 6px 24px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:10px}
.wordmark{direction:ltr;display:inline-flex;align-items:baseline;flex-wrap:nowrap;white-space:nowrap;font-weight:800;letter-spacing:-.04em;font-size:22px;line-height:1.1}
.wordmark span{white-space:nowrap}
.wordmark .w1{color:#fff}
.wordmark .w2{background:#1c2af0;color:#0a0a0a;padding:1px 7px 3px;margin-left:1px}
.auth-card .wordmark{font-size:30px}
.auth-card .wordmark .w1{color:#0a0a0a}
.brand b{font-size:20px;letter-spacing:-.02em}.brand span{font-size:11px;opacity:.7;display:block}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,button,input,textarea{font-family:inherit;font-size:14px;color:var(--text)}
.month{padding:8px 16px;border-radius:980px;border:none;font-weight:600;min-width:120px;background:rgba(255,255,255,.92);cursor:pointer;font-size:14px}
.mp-panel{position:absolute;top:46px;right:0;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;z-index:120;min-width:300px;max-width:92vw;direction:rtl}
.mp-years{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.mp-year{border:none;background:#f0f0f2;color:var(--text);border-radius:980px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:13px}
.mp-year.on{background:var(--sky);color:#fff}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mp-m{border:none;border-radius:12px;padding:9px 4px;font-weight:600;cursor:pointer;font-size:12.5px;background:#f7f7f9;color:var(--text)}
.mp-m:hover{background:#eceffe}
.mp-m.on{background:var(--sky);color:#fff}
.mp-m:disabled{opacity:.25;cursor:default}
.btn{border:none;border-radius:980px;padding:8px 15px;cursor:pointer;font-weight:600;transition:transform .12s,filter .15s;color:#fff;letter-spacing:-.01em;background:var(--sky)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.light{background:rgba(255,255,255,.16)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.gray{background:#e8e8ed;color:var(--text)}.btn.sm{padding:5px 11px;font-size:12.5px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border-radius:980px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.userchip .dot{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
nav.tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--bg);position:sticky;top:58px;z-index:50;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:none;background:none;padding:9px 15px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;font-size:13.5px}
nav.tabs button.active{background:var(--card);color:var(--sky);box-shadow:var(--shadow)}
main{padding:16px;max-width:1280px;margin:0 auto}
.hidden{display:none!important}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.card .val{font-size:21px;font-weight:700;letter-spacing:-.02em}
.card.profit .val{color:var(--green)}.card.out .val{color:var(--amber)}.card.neg .val{color:var(--red)}
.fxline{display:block;font-size:13px;font-weight:700;color:var(--sky);margin-top:3px;letter-spacing:0}
.panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:right;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:#fafafa}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green);font-weight:600}.negv{color:var(--red);font-weight:600}.warn{color:var(--amber)}
input.cell{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;width:84px;font-size:13px;direction:ltr;text-align:right}
input.cell:hover{border-color:var(--line);background:#fff}
input.cell:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
input.cell.wide{width:100%;text-align:right;direction:rtl}
select.cell{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;font-size:13px;cursor:pointer}
select.cell:hover{border-color:var(--line);background:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:980px;font-size:11.5px;font-weight:600}
.pill.g{background:#e3f4e8;color:var(--green)}.pill.r{background:#fde8e8;color:var(--red)}.pill.a{background:#fdf3e3;color:var(--amber)}.pill.b{background:#e5f0fd;color:var(--sky)}.pill.gr{background:#f0f0f2;color:var(--muted)}
.chartbox{position:relative;height:260px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:840px){.grid2{grid-template-columns:1fr}main{padding:10px}nav.tabs{top:96px}}
.fab{position:fixed;bottom:22px;left:22px;width:54px;height:54px;border-radius:50%;background:var(--sky);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(0,113,227,.4);z-index:70;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:22px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:17px;margin-bottom:12px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fafafa}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;padding:16px}
.auth-card{background:#fff;border-radius:26px;padding:34px 30px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h1{font-size:24px;letter-spacing:-.02em;margin-bottom:2px}
.auth-card p.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.auth-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.auth-card input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fafafa;font-size:15px}
.auth-card input:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.auth-card .btn{width:100%;padding:12px;margin-top:18px;font-size:15px}
.auth-err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
.drawer-client{background:#f8f9fb;border-radius:14px;padding:12px;margin:6px 0}
.wl-row{display:grid;grid-template-columns:1.4fr 1fr .7fr .8fr .8fr .8fr 30px;gap:6px;align-items:center;margin-bottom:5px;font-size:12.5px}
.wl-row input,.wl-row select{padding:5px 7px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12.5px;width:100%}
.wl-head{font-size:10.5px;color:var(--muted)}
.xbtn{border:none;background:none;color:var(--red);cursor:pointer;font-size:15px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{pointer-events:auto}
.toast.show{opacity:1}
.mut{color:var(--muted);font-size:12px}
.section-lbl{font-size:11px;color:var(--muted);font-weight:600;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:640px){.brand-sub{display:none}.wl-row{grid-template-columns:1fr 1fr;gap:4px}.card .val{font-size:17px}header{padding:10px 12px}}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tipbox{position:fixed;transform:translateX(-50%);background:#0a0a0a;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;z-index:200;white-space:pre-line;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:280px;pointer-events:none;text-align:right;direction:rtl;line-height:1.6}
[data-tip]{cursor:help;text-decoration:underline dotted rgba(0,0,0,.18);text-underline-offset:3px}
</style>
</head>
<body>
<div id="authScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <h1><span class="wordmark" style="display:inline-flex;flex-wrap:nowrap;white-space:nowrap;align-items:baseline"><span class="w1">baba</span><span class="w2">mark</span></span></h1>
    <p class="sub">מערכת ניהול הסוכנות</p>
    <div id="loginForm">
      <label>אימייל</label><input id="loginEmail" type="email" autocomplete="username" dir="ltr">
      <label>סיסמה</label><input id="loginPass" type="password" autocomplete="current-password" dir="ltr">
      <button class="btn" onclick="doLogin()">כניסה</button>
      <div class="auth-err" id="loginErr"></div>
      <p class="mut" style="margin-top:12px;text-align:center"><span style="cursor:pointer;text-decoration:underline" onclick="forgotPass()">שכחתי סיסמה</span> · <span style="cursor:pointer" onclick="toggleSignup(true)">משתמש ראשון? הרשמה ראשונית</span></p>
    </div>
    <div id="signupForm" class="hidden">
      <label>שם מלא</label><input id="suName">
      <label>אימייל</label><input id="suEmail" type="email" dir="ltr">
      <label>סיסמה (8 תווים לפחות)</label><input id="suPass" type="password" dir="ltr">
      <button class="btn green" onclick="doSignup()">צור חשבון מנהל</button>
      <div class="auth-err" id="suErr"></div>
      <p class="mut" style="margin-top:12px;text-align:center;cursor:pointer" onclick="toggleSignup(false)">חזרה לכניסה</p>
    </div>
  </div>
</div>

<div id="setupScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <h1>הגדרה ראשונית</h1>
    <p class="sub">חיבור למסד הנתונים (פעם אחת בלבד)</p>
    <label>Project URL</label><input id="cfgUrl" dir="ltr" placeholder="https://xxxx.supabase.co">
    <label>Anon public key</label><input id="cfgKey" dir="ltr" placeholder="eyJ...">
    <button class="btn" onclick="saveCfg()">התחבר</button>
    <div class="auth-err" id="cfgErr"></div>
  </div>
</div>

<div id="loader" class="auth-wrap hidden"><div style="color:#fff;text-align:center">
  <span class="wordmark" style="font-size:28px;display:inline-flex;flex-wrap:nowrap;white-space:nowrap;align-items:baseline"><span class="w1">baba</span><span class="w2">mark</span></span>
  <p style="margin-top:14px;opacity:.7;font-size:14px">טוען את המערכת…</p></div></div>
<div id="app" class="hidden">
<header>
  <div class="brand" style="flex-shrink:0;min-width:max-content"><span class="wordmark" style="display:inline-flex;flex-wrap:nowrap;white-space:nowrap;align-items:baseline"><span class="w1">baba</span><span class="w2">mark</span></span><span class="brand-sub" style="font-size:11px;opacity:.65;margin-right:8px">ניהול סוכנות · v7.4</span></div>
  <div class="toolbar">
    <div style="position:relative">
      <button class="month" id="monthBtn" onclick="mpToggle(event)">—</button>
      <div id="mpPanel" class="hidden mp-panel"></div>
    </div>
    <button class="btn green" id="btnNewMonth" onclick="openNewMonth()">+ פתח חודש</button>
    <div class="userchip" onclick="openUserMenu()"><div class="dot" id="userDot">?</div><span id="userName"></span></div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<button class="fab" id="fabBtn" onclick="quickAdd()" title="הוספה מהירה">+</button>
</div>
<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= config & auth ================= */
const BAKED={url:"https://mxustmseyfshuzqtreym.supabase.co",key:"sb_publishable_JDtPQh1JPGR2t1hgmOZ02w_PVRHrdkh"};
let CFG=null;
try{CFG=JSON.parse(localStorage.getItem('bm_cfg')||'null');}catch(e){}
if(!CFG&&location.hash.startsWith('#cfg=')){try{CFG=JSON.parse(atob(location.hash.slice(5)));localStorage.setItem('bm_cfg',JSON.stringify(CFG));history.replaceState(null,'',location.pathname);}catch(e){}}
if(!CFG&&BAKED.url)CFG=BAKED;
let INVITE=null;
if(location.hash.startsWith('#invite=')){
  try{INVITE=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(8)))));}catch(e){}
}
let sb=null,ME=null,MYROLE='manager';
const $=id=>document.getElementById(id);
const NIS=n=>(+n||0).toLocaleString('he-IL',{maximumFractionDigits:0});
const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let TOAST_T=null;const toast=(m,ms)=>{const t=$('toast');if(/<span/.test(m))t.innerHTML=m;else t.textContent=m;t.classList.add('show');clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.classList.remove('show'),ms||2200);};

function saveCfg(){
  const url=$('cfgUrl').value.trim(),key=$('cfgKey').value.trim();
  if(!url.startsWith('https://')||key.length<20){$('cfgErr').textContent='בדוק את הכתובת והמפתח';return;}
  CFG={url,key};localStorage.setItem('bm_cfg',JSON.stringify(CFG));location.reload();
}
function toggleSignup(s){$('loginForm').classList.toggle('hidden',s);$('signupForm').classList.toggle('hidden',!s);}
/* v7.4: איפוס סיסמה — מייל מ-Supabase עם קישור; הקישור מחזיר לכאן ומאפשר לקבוע סיסמה חדשה */
async function forgotPass(){const email=$('loginEmail').value.trim();if(!email){$('loginErr').textContent='כתוב את האימייל שלך למעלה ואז לחץ "שכחתי סיסמה"';return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
  $('loginErr').style.color=error?'':'var(--green)';$('loginErr').textContent=error?('לא הצלחתי לשלוח: '+error.message):'נשלח מייל ל-'+email+' — פתח את הקישור שבו (מהמכשיר הזה) ותקבע סיסמה חדשה';}
async function maybeRecovery(){try{const h=location.hash||'';if(!/type=recovery/.test(h))return false;
  const {data:{session}}=await sb.auth.getSession();if(!session)return false;
  const np=prompt('קבע סיסמה חדשה (8 תווים לפחות):');if(!np||np.length<8){toast('סיסמה קצרה מדי');return false;}
  const {error}=await sb.auth.updateUser({password:np});if(error){alert('שגיאה: '+error.message);return false;}
  history.replaceState(null,'',location.pathname);toast('הסיסמה עודכנה ✓');return true;}catch(e){return false;}}
async function doLogin(){
  $('loginErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPass').value});
  if(error){$('loginErr').textContent='פרטי התחברות שגויים';return;}
  location.reload();
}
async function doSignup(){
  $('suErr').textContent='';
  const {data,error}=await sb.auth.signUp({email:$('suEmail').value.trim(),password:$('suPass').value,options:{data:{name:$('suName').value.trim()}}});
  if(error){$('suErr').textContent=error.message;return;}
  if(INVITE&&data?.user){
    try{await sb.from('profiles').update({role:INVITE.role||'manager',name:$('suName').value.trim()}).eq('id',data.user.id);}catch(e){}
  }
  history.replaceState(null,'',location.pathname);
  toast('החשבון נוצר');location.reload();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

/* ================= data layer ================= */
let DB={months:[],entries:[],clients:[],team:[],products:[],pipeline:[],invoices:[],subs:[],settings:{},profiles:[],productions:[]};
let CURMONTH=null,CUR='overview';
const VAT=()=>+(DB.settings.vat??0.18);

async function loadAll(){
  const t=(name)=>sb.from(name).select('*');
  const [mo,en,cl,tm,pr,pi,inv,su,se,pf,pd]=await Promise.all([
    t('months').order('ord'),t('entries'),t('clients').order('retainer',{ascending:false}),
    t('team_members').order('name'),t('products'),t('pipeline'),t('invoices'),t('subs'),t('settings'),t('profiles'),t('productions')]);
  DB.months=mo.data||[];DB.entries=en.data||[];DB.clients=cl.data||[];DB.team=tm.data||[];
  DB.products=pr.data||[];DB.pipeline=pi.data||[];DB.invoices=inv.data||[];DB.subs=su.data||[];DB.profiles=pf.data||[];
  DB.productions=(pd.data||[]).sort((a,b)=>b.id-a.id);
  if(ME?.role==='project'){const ids=(ME.perms?.prod_ids||[]).map(Number);DB.productions=DB.productions.filter(p=>ids.includes(+p.id));}
  DB.settings={};(se.data||[]).forEach(r=>{let v=r.value;

const clientCfg=()=>sj('client_cfg',{});

/* entry_office: { [entryId]: {pct} | {amt} }  — ההחלטה של אריאל לכל כרטיס: כמה יורד למשרד מהרווח לפני חלוקת הצוות */
function entryOffice(id){const m=sj('entry_office',{});const v=m[id];return v==null?null:(typeof v==='object'?v:{pct:+v||0});}

/* שעות עלות: מה שהמעצב דיווח (cost_qty) · שעות חיוב: מה שמחייבים את הלקוח (qty) */
const wlCostQty=w=>(w.cost_qty!=null&&w.cost_qty!=='')?(+w.cost_qty||0):(+w.qty||0);

/* ================= calc engine ================= */
function rateOf(name){return DB.team.find(t=>t.name===name)||{cost_rate:0,bill_rate:0};}
function defVat(m){const mo=DB.months.find(x=>x.label===m);return(mo&&mo.ord<24301)?0.17:(+(DB.settings.vat??0.18));}
function calc(r){
  const wl=r.work_lines||[],addons=r.addons||[],team=r.team||[];
  const wlCost=wl.reduce((a,x)=>a+wlCostQty(x)*(+x.cost_rate||0),0);
  const wlCharge=wl.reduce((a,x)=>a+(+x.qty||0)*(+x.bill_rate||0),0);
  const addonCharge=addons.reduce((a,x)=>a+(+x.charge||0),0);
  const addonCost=addons.reduce((a,x)=>a+(+x.cost||0),0);
  const teamFixed=team.reduce((a,x)=>a+(+x.amount||0),0);
  const base=(+r.retainer||0)+(+r.shooting||0)+(+r.design||0);
  const exVat=base+addonCharge+wlCharge;
  const vrate=(r.vat!=null?+r.vat:defVat(r.month_label));
  const vat=exVat*vrate,incVat=exVat+vat,paid=+r.paid_amt||0,balance=incVat-paid;
  const legacy=(+r.mgr_cost||0)+(+r.des_cost||0)+(+r.ext_cost||0);
  const costBeforePct=legacy+addonCost+wlCost+teamFixed;
  const profitBase=exVat-costBeforePct;
  /* v6.0 — שורת עבודה שמחויבת ללקוח: המרווח שלה (חיוב − עלות) שייך למשרד בלבד ולא נכנס לחלוקה.
     שורת עבודה בלי חיוב ללקוח ("אדומה"): העלות יורדת מהרווח המשותף לפני החלוקה. */
  const wlBilled=wl.filter(x=>(+x.qty||0)*(+x.bill_rate||0)>0);
  const wlChargeBilled=wlBilled.reduce((a,x)=>a+(+x.qty||0)*(+x.bill_rate||0),0);
  const wlCostBilled=wlBilled.reduce((a,x)=>a+wlCostQty(x)*(+x.cost_rate||0),0);
  const wlCostUnbilled=wlCost-wlCostBilled;
  const splitBase=(exVat-wlChargeBilled)-(legacy+addonCost+wlCostUnbilled+teamFixed);
  /* v4.8 — עמלת משרד: אחוז קבוע (ברירת מחדל 10%) שיורד מהרווח לפני חלוקת האחוזים ליוצרי התוכן */
  const cc=ccOf(r.client_name);
  const hasPct=team.some(x=>+x.percent>0);
  /* החלטה פר-כרטיס (entry_office: {id: pct}) גוברת על ברירת המחדל של הלקוח */
  const eo=entryOffice(r.id);   /* {pct} או {amt} או null=לא נשאל עדיין / {pct:0}=לא */
  let officePct=0,officeCut=0,officeAmt=0;
  if(eo){officePct=+eo.pct||0;officeAmt=+eo.amt||0;
    officeCut=officeAmt?Math.min(officeAmt,Math.max(splitBase,0)):((officePct&&splitBase>0)?splitBase*officePct/100:0);}
  else if(hasPct&&+cc.office_pct>0&&(!cc.office_from||monthOrdOf(r.month_label)>=+cc.office_from)){officePct=+cc.office_pct;officeCut=splitBase>0?splitBase*officePct/100:0;}
  const shareBase=splitBase-officeCut;
  const pctShares=team.filter(x=>+x.percent>0).map(x=>({member:x.member,share:shareBase>0?shareBase*(+x.percent/100):0}));
  const pctCost=pctShares.reduce((a,x)=>a+x.share,0);
  const offsets=team.reduce((a,x)=>a+(+x.offset||0),0);
  const cost=costBeforePct+pctCost-offsets;
  const profit=exVat-cost,margin=exVat?profit/exVat:0;
  return{base,exVat,vrate,vat,incVat,paid,balance,cost,profit,margin,wlCost,wlCharge,addonCharge,addonCost,teamFixed,pctShares,pctCost,offsets,profitBase,splitBase,wlChargeBilled,wlCostBilled,wlCostUnbilled,officePct,officeCut,officeAmt,shareBase,officeAsked:eo!=null};
}
const eCur=r=>r.currency||'ILS';
const eRate=r=>(r.currency&&r.currency!=='ILS')?(+r.ils_rate||1):1;
function monthTotals(m){
  const T={billed:0,collected:0,outstanding:0,cost:0,profit:0,incVat:0,fx:{}};
  entriesOf(m).forEach(r=>{const k=calc(r);const c=eCur(r);
    let t=T;
    if(c!=='ILS')t=T.fx[c]=T.fx[c]||{billed:0,collected:0,outstanding:0,cost:0,profit:0,incVat:0};
    t.billed+=k.exVat;t.collected+=k.paid;t.outstanding+=k.balance;t.cost+=k.cost;t.profit+=k.profit;t.incVat+=k.incVat;});

}

function tipAdd(r,k){const p=[];
  (r.addons||[]).forEach(a=>{if(+a.charge)p.push((a.desc||'תוספת')+': '+NIS(a.charge)+' ₪');});
  (r.work_lines||[]).forEach(w=>{const c=(+w.qty||0)*(+w.bill_rate||0);if(c)p.push((w.member||'עבודה')+' · '+(+w.qty||0)+' × '+NIS(w.bill_rate)+' = '+NIS(c)+' ₪');});
  return p.length?'תוספות חיוב:\n'+p.join('\n'):'אין תוספות החודש';}
function tipCost(r,k){const p=[];const lg=(+r.mgr_cost||0)+(+r.des_cost||0)+(+r.ext_cost||0);
  if(lg)p.push('עלויות ישירות: '+NIS(lg)+' ₪');
  const prof=DB.clients.find(c=>c.name===r.client_name);
  const base=prof?.team||[];
  if(k.officeCut||k.wlChargeBilled)p.push('בסיס לחלוקה: '+NIS(k.splitBase)+' ₪'+(k.wlChargeBilled?' (מעצב מחויב ללקוח — המרווח '+NIS(k.wlChargeBilled-k.wlCostBilled)+' ₪ למשרד, מחוץ לחלוקה)':'')+(k.officeCut?' − עמלת משרד '+(k.officePct?k.officePct+'% ':'')+'('+NIS(k.officeCut)+' ₪) = '+NIS(k.shareBase)+' ₪':''));
  (r.team||[]).forEach(t=>{
    if(!t.member)return;
    let line=t.member+(t.role?' ('+t.role+')':'')+': ';
    const bits=[];
    if(+t.amount)bits.push(NIS(t.amount)+' ₪');
    if(+t.percent){const sh=k.pctShares.find(x=>x.member===t.member);bits.push(t.percent+'% = '+NIS(sh?sh.share:0)+' ₪');}
    if(+t.offset)bits.push('קיזוז −'+NIS(t.offset));
    line+=bits.join(' + ')||'0';
    const b=base.find(x=>x.member===t.member);
    if(!b&&base.length)line+='  ← נוסף החודש';
    else if(b&&((+b.amount||0)!==(+t.amount||0)||+(b.percent||0)!==+(t.percent||0)))line+='  ← שונה מהפרופיל ('+(+b.amount?NIS(b.amount)+' ₪':(b.percent||0)+'%')+')';
    p.push(line);});
  base.forEach(b=>{if(b.member&&!(r.team||[]).find(t=>t.member===b.member))
    p.push('⚠ '+b.member+' הוסר החודש (בפרופיל: '+(+b.amount?NIS(b.amount)+' ₪':(b.percent||0)+'%')+')');});
  (r.work_lines||[]).forEach(w=>{const cq=wlCostQty(w);const c2=cq*(+w.cost_rate||0);
    if(c2)p.push((w.member||'עבודה')+(w.desc?' · '+w.desc:'')+': '+cq+' × '+NIS(w.cost_rate)+' = '+NIS(c2)+' ₪'+(cq!==(+w.qty||0)?' (חויב ללקוח: '+(+w.qty||0)+' ש׳)':''));});
  if(k.addonCost)p.push('עלות תוספות: '+NIS(k.addonCost)+' ₪');
  if(k.offsets&&!(r.team||[]).some(t=>+t.offset))p.push('קיזוזים: −'+NIS(k.offsets)+' ₪');
  return p.length?'הרכב העלויות:\n'+p.join('\n'):'אין עלויות רשומות';}
function tipEx(r,k){const p=['ריטיינר: '+NIS(r.retainer)+' ₪'];
  if(+r.shooting)p.push('צילומים/אחר: '+NIS(r.shooting)+' ₪');
  if(+r.design)p.push('עיצוב: '+NIS(r.design)+' ₪');
  if(k.addonCharge)p.push('תוספות: '+NIS(k.addonCharge)+' ₪');

  return 'חיוב לפני מע״מ:\n'+p.join('\n');}

function hiGuessClient(brand){
  const b=hiNorm(brand);if(!b)return '';
  const map=sj('brand_map',{});
  if(map[b])return DB.clients.find(c=>c.name===map[b])?map[b]:'';
  for(const c of DB.clients){const bs=(ccOf(c.name).brands||[]).map(hiNorm);if(bs.includes(b))return c.name;}
  const ex=DB.clients.find(c=>hiNorm(c.name)===b);if(ex)return ex.name;
  const part=DB.clients.filter(c=>{const n=hiNorm(c.name);return n.includes(b)||b.includes(n);});
  if(part.length===1)return part[0].name;
  const words=b.split(' ').filter(w=>w.length>2);
  const w2=DB.clients.filter(c=>{const n=hiNorm(c.name);return words.some(w=>n.includes(w));});
  return w2.length===1?w2[0].name:'';
}

  const email=$('ezEmail').value.trim();
  const body={
    type:dtype,
    tx:ezTx(r.month_label+'|'+r.client_name+(EZOPT?.po?'|PO'+EZOPT.po.number+'|'+EZOPT.po.kind+'|'+EZOPT.po.pct:'')+'|'+dtype+'|'+Math.round(exSum)),
    month_label:r.month_label,
    customer_name:$('ezName').value.trim()||r.client_name,
    customer_email:email||null,
    customer_crn:crn||null,
    doc_date:docDate,
    date:docDate,
    description:'שירותי שיווק ודיגיטל · '+heLabel(r.month_label),
    vat_pct:k.vrate*100,
    send_email:!!email,
    comment:DB.settings.inv_footer||'',
    tax_authority:isPro?undefined:{is_skip_fallback:alloc==='skip',is_anonymous_fallback:alloc==='anon'},
    items:EZL.filter(l=>(+l.amount||0)*(+l.price||0)>0&&(l.details||'').trim()).map(l=>({details:l.details,amount:+l.amount||1,price:+l.price||0,comment:l.comment||undefined}))
  };
  if(!body.items.length){$('ezErr').textContent='אין שורות תקינות';$('ezGo').disabled=false;$('ezGo').textContent='⚡ הפק חשבונית';return;}
  try{
    const {data,error}=await sb.functions.invoke('ezcount',{body});
    if(error)throw new Error(error.message||'שגיאת חיבור');
    if(!data?.success){const en=data?.errNum;let msg=data?.errMsg||'EZcount החזיר שגיאה';
      if(en===460||/הקצאה|allocation|tax.?authority|רשות המס/i.test(msg))msg='רשות המסים לא נתנה מספר הקצאה ('+msg+').\nאפשרויות: ודא ח.פ נכון · בחר "לקוח ללא ח.פ" · או "הפק בלי מספר הקצאה" ונסה שוב';
      else if(/date|תאריך/i.test(msg))msg='EZcount דחה את התאריך ('+msg+'). התאריך חייב להיות ≥ החשבונית האחרונה שהופקה.';
      throw new Error(msg);}
    if(!isPro&&(!last||docISO>last))await setSetting('ez_last_date',docISO);
    if(EZOPT?.po&&isPro){
      /* חשבון עסקה על הזמנת רכש — נרשם על ההזמנה בלבד, לא הכנסה */
      const pp=prodn(EZOPT.po.prod_id);if(pp){const pos=structuredClone(pp.pos||[]);const o=pos[EZOPT.po.idx];
        if(o){o.proformas=[...(o.proformas||[]),{doc:data.doc_number||'',amount:exSum,date:docISO,kind:EZOPT.po.kind,pct:EZOPT.po.pct,pdf:data.pdf_link||''}];await upd('productions',pp.id,{pos});}}
    }else if(isPro){
      await ins('invoices',{month_label:r.month_label,client_name:r.client_name+' · חשבון עסקה',status:'חשבון עסקה',number:data.doc_number||'',pdf_link:data.pdf_link||'',doc_number:data.doc_number||'',amount:Math.round(exSum*(1+k.vrate)*100)/100});
    }else if(EZOPT?.po){
      /* חשבונית מס על הזמנת רכש: תוספת בכרטיס החודש (הכנסה) + רשומת גבייה + תיעוד על ההזמנה */
      {const addons=structuredClone(r.addons||[]).filter(a=>a.desc!==EZOPT.po.addon_desc);addons.push({desc:EZOPT.po.addon_desc,charge:exSum,cost:0,po:EZOPT.po.number,po_kind:EZOPT.po.kind,prod_id:EZOPT.po.prod_id});await upd('entries',r.id,{addons});}
      /* חשבונית להזמנת רכש: רשומה נפרדת בגבייה + תיעוד על ההזמנה בהפקה */
      await ins('invoices',{month_label:r.month_label,client_name:r.client_name+' · PO '+EZOPT.po.number+' · '+EZOPT.po.kindTxt,status:'הופקה',number:data.doc_number||'',pdf_link:data.pdf_link||'',doc_number:data.doc_number||'',amount:Math.round(exSum*(1+k.vrate)*100)/100});
      const pp=prodn(EZOPT.po.prod_id);if(pp){const pos=structuredClone(pp.pos||[]);const o=pos[EZOPT.po.idx];
        if(o){if(EZOPT.po.fromProforma!=null)(o.proformas||[]).splice(EZOPT.po.fromProforma,1);
          o.invoices=[...(o.invoices||[]),{kind:EZOPT.po.kind,pct:EZOPT.po.pct,amount:exSum,doc:data.doc_number||'',pdf:data.pdf_link||'',date:docISO,entry_id:r.id,month:r.month_label}];
          const paid=o.invoices.reduce((a,x)=>a+(+x.amount||0),0);o.inv=paid>=(+o.amount||0)-1?'הופקה':'מקדמה';o.inv_number=data.doc_number||'';
          await upd('productions',pp.id,{pos});}}
    }else{
    const inv=DB.invoices.find(x=>x.month_label===r.month_label&&x.client_name===r.client_name);
    const patch={status:'הופקה',number:data.doc_number||'',pdf_link:data.pdf_link||'',doc_number:data.doc_number||'',amount:k.incVat};
    if(inv)await upd('invoices',inv.id,patch);
    else await ins('invoices',{month_label:r.month_label,client_name:r.client_name,...patch});
    }
    if(!EZOPT?.po&&!isPro){const c2=DB.clients.find(x=>x.name===r.client_name);
      if(c2){const lines=EZL.map(l=>({details:(l.details||'').replace(heLabel(r.month_label),'{חודש}'),amount:l.amount,price:l.price,comment:l.comment||''}));
        /* v5.7 — פרטי החשבונית שהוקלדו (ח.פ, שם לחשבונית, אימייל) נשמרים לפרופיל הלקוח לפעם הבאה */
        const prof={inv_template:{lines}};
        const nm=($('ezName')?.value||'').trim(),em=($('ezEmail')?.value||'').trim();
        if(crn&&crn!==(c2.biz_id||''))prof.biz_id=crn;
        if(nm&&nm!==(c2.invoice_name||'')&&nm!==c2.name)prof.invoice_name=nm;
        if(em&&em!==(c2.email||''))prof.email=em;
        try{await sb.from('clients').update(prof).eq('id',c2.id);Object.assign(c2,prof);}catch(e){}}
    }
    closeModal();toast((isPro?'חשבון עסקה ':'חשבונית ')+(data.doc_number||'')+' הופק/ה ✓');
    if(data.pdf_link){const w=window.open(data.pdf_link,'_blank');if(!w)toast('ה-PDF נחסם — פתח מהקישור בהזמנת הרכש / בגבייה');}
    if(EZOPT?.po){EZOPT=null;renderProd();}else render();
  }catch(e){
    $('ezErr').textContent=e.message.includes('Failed to send')?'הפונקציה ezcount לא מותקנת עדיין ב-Supabase — עקוב אחרי ההוראות':e.message;
    $('ezGo').disabled=false;$('ezGo').textContent='⚡ הפק חשבונית';
  }
}

    ${ed?`<button class="btn sm gray" style="padding:3px 9px;font-size:11px" onclick="officeSet(${id},'reset')">שנה</button>`:''}
  </div>`;

async function officeSet(id,mode,val){
  const r=entry(id);if(!r)return;
  if(mode==='reset'){if(entryOffice(id)==null)OFFICE_EDIT=id;else await setEntryOffice(id,null);openEntry(id);return;}
  if(mode==='no'){await setEntryOffice(id,{pct:0});toast('נשמר — בלי עמלת משרד');openEntry(id);return;}
  await setEntryOffice(id,mode==='amt'?{amt:+val||0}:{pct:+val||0});
  /* חלוקות בסכום קבוע? — העמלה יורדת לפני אחוזים בלבד, אז מציעים להמיר */
  const team=structuredClone(r.team||[]);const fixed=team.filter(t=>t.member&&+t.amount>0&&!(+t.percent>0));
  if(fixed.length){
    const k=calc({...r,team:team.map(t=>({...t,amount:0}))});   /* בסיס לחלוקה לפני חלוקות */
    const base=k.splitBase;
    if(base>0){
      const conv=fixed.map(t=>({t,pct:Math.round(+t.amount/base*1000)/10}));
      const msg='לחלוקות האלה יש סכום קבוע, והעמלה יורדת לפני חלוקות באחוזים.\nלהמיר לאחוזים מהרווח ('+NIS(base)+' ₪) כדי שהעמלה תחושב לפניהן?\n\n'+conv.map(x=>x.t.member+': '+NIS(x.t.amount)+' ₪ → '+x.pct+'%').join('\n')+'\n\n(ביטול = להשאיר סכומים קבועים)';
      if(confirm(msg)){conv.forEach(x=>{x.t.percent=x.pct;x.t.amount=0;});await upd('entries',id,{team});}
    }
  }
  toast('עמלת משרד נשמרה');openEntry(id);
}
function officeCustom(id){
  const p=+String($('offPct'+id)?.value||'').replace(/[^\d.]/g,'')||0,a=+String($('offAmt'+id)?.value||'').replace(/[^\d.]/g,'')||0;
  if(!p&&!a){toast('הזן אחוז או סכום');return;}
  officeSet(id,a?'amt':'pct',a||p);
}

/* ===== ייבוא לקוחות עבר מאיזיקאונט (קובץ ייצוא של לקוחות או של מסמכים) ===== */
let CI=null;
function ciModal(){
  CI=null;
  modal(`<h3>ייבוא לקוחות מאיזיקאונט</h3>
  <p class="mut">באיזיקאונט: <b>לקוחות → ייצוא לאקסל</b> (או <b>מסמכים → ייצוא</b> — ואז אאסוף את שמות הלקוחות מהחשבוניות). העלה כאן את הקובץ ותבחר את מי להוסיף.</p>
  <input type="file" id="ciFile" accept=".xlsx,.xls,.csv,.txt" onchange="ciParse()">
  <p id="ciErr" class="negv" style="margin-top:6px"></p>
  <div id="ciBody"></div>`);
}
const CI_COLS={
  name:/^(שם\s*(ה)?לקוח|לקוח|שם|customer(\s*name)?|client|name|שם העסק|שם מלא)$/i,
  biz:/ח\.?פ|ת\.?ז|עוסק|מספר עוסק|מזהה|vat|tax\s*id|company\s*id|id\s*number/i,
  email:/מייל|email|דוא"?ל|דואר/i,
  phone:/טלפון|נייד|phone|mobile|tel/i,
  address:/כתובת|address|עיר|city/i,
  contact:/איש קשר|contact/i,
  date:/תאריך|date/i,
  amount:/סכום|סה"?כ|total|amount|לתשלום/i,
  doc:/מספר מסמך|מס'? מסמך|מסמך|doc|חשבונית/i
};
function ciFind(hdr,re,strict){const i=hdr.findIndex(h=>strict?re.test(String(h).trim()):re.test(String(h)));return i;}
async function ciParse(){
  const f=$('ciFile').files[0];if(!f)return;$('ciErr').textContent='';
  let aoa;
  try{
    if(/\.(csv|txt)$/i.test(f.name)){const txt=await f.text();const sep=txt.includes('\t')?'\t':',';
      aoa=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')));}
    else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:''});}
  }catch(e){$('ciErr').textContent='לא הצלחתי לקרוא את הקובץ: '+e.message;return;}
  /* שורת כותרות = הראשונה שיש בה עמודת שם */
  let hi=aoa.findIndex(r=>r.some(c=>CI_COLS.name.test(String(c).trim())));
  if(hi<0)hi=aoa.findIndex(r=>r.some(c=>/לקוח|customer|client/i.test(String(c))));
  if(hi<0){$('ciErr').textContent='לא מצאתי עמודת "שם לקוח" בקובץ. ודא שזה ייצוא מאיזיקאונט עם שורת כותרות.';return;}
  const hdr=aoa[hi].map(h=>String(h).trim());
  let iN=ciFind(hdr,CI_COLS.name,true);if(iN<0)iN=hdr.findIndex(h=>/לקוח|customer|client/i.test(h));
  const iB=ciFind(hdr,CI_COLS.biz),iE=ciFind(hdr,CI_COLS.email),iP=ciFind(hdr,CI_COLS.phone),iA=ciFind(hdr,CI_COLS.address),iC=ciFind(hdr,CI_COLS.contact),iD=ciFind(hdr,CI_COLS.date),iS=ciFind(hdr,CI_COLS.amount),iDoc=ciFind(hdr,CI_COLS.doc);
  const isDocs=iDoc>=0||iS>=0;
  const map=new Map();
  for(const r of aoa.slice(hi+1)){
    const nm=String(r[iN]??'').trim();if(!nm||/^(סה"?כ|total)/i.test(nm))continue;
    const key=nm.toLowerCase();
    const o=map.get(key)||{name:nm,biz_id:'',email:'',phone:'',address:'',contact:'',docs:0,sum:0,last:''};
    if(iB>=0&&!o.biz_id)o.biz_id=String(r[iB]??'').trim();
    if(iE>=0&&!o.email)o.email=String(r[iE]??'').trim();
    if(iP>=0&&!o.phone)o.phone=String(r[iP]??'').trim();
    if(iA>=0&&!o.address)o.address=String(r[iA]??'').trim();
    if(iC>=0&&!o.contact)o.contact=String(r[iC]??'').trim();
    if(isDocs){o.docs++;if(iS>=0)o.sum+=(+String(r[iS]).replace(/[^\d.-]/g,'')||0);
      if(iD>=0){const d=r[iD] instanceof Date?r[iD].toISOString().slice(0,10):String(r[iD]??'');if(d>o.last)o.last=d;}}
    map.set(key,o);
  }
  const existing=new Set(DB.clients.map(c=>c.name.trim().toLowerCase()).concat(DB.clients.map(c=>(c.invoice_name||'').trim().toLowerCase()).filter(Boolean)));
  const rows=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'he'));
  rows.forEach(r=>r.exists=existing.has(r.name.toLowerCase()));
  CI={rows,isDocs};
  ciRender();
}
function ciRender(){
  if(!CI)return;const {rows,isDocs}=CI;const nw=rows.filter(r=>!r.exists);
  $('ciBody').innerHTML=`<p class="mut" style="margin:8px 0">נמצאו <b>${rows.length}</b> לקוחות בקובץ · <b>${nw.length}</b> חדשים (${rows.length-nw.length} כבר קיימים במערכת)</p>
  <div class="row" style="gap:6px;margin-bottom:6px"><button class="btn sm gray" onclick="ciAll(true)">סמן הכל</button><button class="btn sm gray" onclick="ciAll(false)">נקה</button>
  <label class="mut" style="font-size:12px"><input type="checkbox" id="ciActive"> להוסיף כפעילים (ברירת מחדל: לא פעילים — לא ייכנסו לחודש)</label></div>
  <div class="tblwrap" style="max-height:50vh;overflow:auto"><table class="tbl"><thead><tr><th></th><th>לקוח</th><th>ח.פ</th><th>אימייל</th><th>טלפון</th>${isDocs?'<th>מסמכים</th><th>סה״כ</th><th>אחרון</th>':''}<th></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr style="${r.exists?'opacity:.5':''}">
    <td><input type="checkbox" class="ci_ck" data-i="${i}" ${r.exists?'disabled':''}></td>
    <td style="font-weight:600">${esc(r.name)}</td><td dir="ltr">${esc(r.biz_id)}</td><td dir="ltr">${esc(r.email)}</td><td dir="ltr">${esc(r.phone)}</td>
    ${isDocs?`<td>${r.docs}</td><td>${r.sum?NIS(r.sum)+' ₪':''}</td><td dir="ltr">${esc(r.last)}</td>`:''}
    <td class="mut" style="font-size:11px">${r.exists?'קיים':''}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:10px;gap:8px"><button class="btn green" onclick="ciSave()">הוסף את המסומנים</button><button class="btn gray" onclick="closeModal()">ביטול</button></div>`;
}

  const curOrd=(DB.months.find(m=>m.label===curLbl)||{}).ord||0;
  const future=DB.entries.filter(e=>e.client_name===c.name&&((DB.months.find(m=>m.label===e.month_label)||{}).ord||0)>=curOrd);

/* איך חושב החלק של שותף באחוזים: חיוב − עלויות − עמלת משרד = בסיס × % */
function shareBreakdown(r,member){
  const k=calc(r);const t=(r.team||[]).find(x=>x.member===member&&+x.percent>0);if(!t)return null;
  const ded=[];
  const lg=(+r.mgr_cost||0)+(+r.des_cost||0)+(+r.ext_cost||0);if(lg)ded.push({label:'עלויות ישירות',amount:lg});
  (r.work_lines||[]).forEach(w=>{const a=wlCostQty(w)*(+w.cost_rate||0);const chg=(+w.qty||0)*(+w.bill_rate||0);
    if(chg>0)ded.push({label:(w.member||'עבודה')+(w.desc?' · '+w.desc:'')+' — מחויב ללקוח '+NIS(chg)+', המרווח למשרד (לא בחלוקה)',amount:chg,billed:true});
    else if(a)ded.push({label:(w.member||'עבודה')+(w.desc?' · '+w.desc:'')+' ('+wlCostQty(w)+' × '+NIS(w.cost_rate)+') — ללא חיוב ללקוח',amount:a});});
  (r.addons||[]).forEach(a=>{if(+a.cost)ded.push({label:'עלות '+(a.desc||'תוספת'),amount:+a.cost});});
  (r.team||[]).forEach(x=>{if(x.member&&+x.amount)ded.push({label:x.member+' (סכום קבוע'+(x.role?' · '+x.role:'')+')',amount:+x.amount});});
  if(k.officeCut)ded.push({label:'עמלת משרד '+(k.officeAmt?'קבועה':k.officePct+'%'),amount:k.officeCut,office:true});
  const sh=k.pctShares.find(y=>y.member===member);
  return{exVat:k.exVat,ded,profitBase:k.splitBase,officeCut:k.officeCut,shareBase:k.shareBase,pct:+t.percent,share:sh?sh.share:0,offset:+t.offset||0,offset_note:t.offset_note||''};
}
/* מה מגיע לספקים/צוות מכרטיס אחד — לעמודה בסגירת חודש */
function entryPayouts(r){
  const k=calc(r);const P={};
  const add=(n,v)=>{if(!n)return;P[n]=(P[n]||0)+v;};
  (r.team||[]).forEach(t=>{add(t.member,(+t.amount||0));if(+t.percent>0){const sh=k.pctShares.find(y=>y.member===t.member);add(t.member,sh?sh.share:0);}add(t.member,-(+t.offset||0));});
  (r.work_lines||[]).forEach(w=>add(w.member,wlCostQty(w)*(+w.cost_rate||0)));
  const total=Object.values(P).reduce((a,b)=>a+b,0);
  return{P,total};
}
function tipSuppliers(r){const {P,total}=entryPayouts(r);const names=Object.keys(P);if(!names.length)return 'אין תשלומים לספקים/צוות בכרטיס זה';
  const lines=names.map(n=>{const b=shareBreakdown(r,n);let t=n+': '+NIS(P[n])+' ₪';
    if(b)t+='  ('+NIS(b.exVat)+' − '+b.ded.map(d=>d.office?'משרד '+NIS(d.amount):NIS(d.amount)).join(' − ')+' = '+NIS(b.shareBase)+' × '+b.pct+'%)';return t;});
  return 'מגיע לספקים ולצוות:\n'+lines.join('\n')+'\nסה״כ: '+NIS(total)+' ₪\n\nלחץ לדוח מפורט — כולל מה ירד לכל אחד';}
function payoutsOf(m){
  const P={};
  entriesOf(m).forEach(r=>{
    const k=calc(r);const c=eCur(r);const key=n=>n+(c==='ILS'?'':' · '+CURR[c]);
    (r.team||[]).forEach(t=>{if(!t.member)return;
      const p=P[key(t.member)]=P[key(t.member)]||{fixed:0,pct:0,work:0,offset:0,notes:[],cur:c};
      p.fixed+=(+t.amount||0);
      if(+t.percent>0){const sh=k.pctShares.find(y=>y.member===t.member);p.pct+=(sh?sh.share:0);}
      p.offset+=(+t.offset||0);
      if(+t.offset&&t.offset_note)p.notes.push(r.client_name+': '+t.offset_note);});
    (r.work_lines||[]).forEach(w=>{if(!w.member)return;
      const p=P[key(w.member)]=P[key(w.member)]||{fixed:0,pct:0,work:0,offset:0,notes:[],cur:c};
      p.work+=wlCostQty(w)*(+w.cost_rate||0);});
  });
  return P;
}
function rSettle(){

  <tr><td style="font-weight:700">סה״כ</td><td></td><td></td><td></td><td></td><td class="num" style="font-weight:700">${NIS(tot)} ₪${Object.entries(totFx).map(([c,v])=>`<span class="fxline">+ ${NIS(v)} ${CURR[c]}</span>`).join('')}</td><td></td></tr>
  </tbody></table></div>`;

/* ================= payroll — כמה מגיע לכל עובד החודש (v4.8) ================= */
function payrollLines(m){
  const L=[];
  entriesOf(m).forEach(r=>{const k=calc(r);const cur=eCur(r);
    (r.team||[]).forEach(t=>{if(!t.member)return;
      if(+t.amount)L.push({who:t.member,client:r.client_name,kind:'קבוע',desc:t.role||'',qty:'',rate:'',amount:+t.amount,cur});
      if(+t.percent>0){const sh=k.pctShares.find(y=>y.member===t.member);
        L.push({who:t.member,client:r.client_name,kind:'% מרווח',desc:(t.role?t.role+' · ':'')+t.percent+'% מ-'+NIS(k.shareBase)+(k.officeCut?' (אחרי משרד '+NIS(k.officeCut)+')':''),qty:'',rate:'',amount:sh?sh.share:0,cur,bd:shareBreakdown(r,t.member)});}
      if(+t.offset)L.push({who:t.member,client:r.client_name,kind:'קיזוז',desc:t.offset_note||'',qty:'',rate:'',amount:-(+t.offset),cur});});
    (r.work_lines||[]).forEach(w=>{if(!w.member)return;const cq=wlCostQty(w);const a=cq*(+w.cost_rate||0);if(!a&&!cq)return;
      L.push({who:w.member,client:r.client_name,kind:'שעות',desc:w.desc||'',qty:cq,rate:+w.cost_rate||0,amount:a,cur,billed:+w.qty||0});});
  });
  L.push(...reimburseLines(m));
  return L;
}

/* ================= smart analysis ================= */
function rSmart(){
  const all=monthLabels();const last12=all.slice(-12);
  const perClient={};
  last12.forEach(m=>entriesOf(m).forEach(r=>{const k=calc(r);if(k.exVat<=0)return;
    const c=perClient[r.client_name]=perClient[r.client_name]||{rev:0,profit:0,mos:0,paid:0,inc:0};
    c.rev+=k.exVat;c.profit+=k.profit;c.mos++;c.paid+=k.paid;c.inc+=k.incVat;}));
  const arr=Object.entries(perClient).map(([n,v])=>({n,...v,marg:v.rev?v.profit/v.rev:0}));
  const low=arr.filter(x=>x.marg<0.35).sort((a,b)=>a.marg-b.marg);
  const high=arr.filter(x=>x.marg>=0.6).sort((a,b)=>b.profit-a.profit);
  const debt=arr.filter(x=>x.inc-x.paid>1).sort((a,b)=>(b.inc-b.paid)-(a.inc-a.paid));
  const li=(t,c)=>`<div class="drawer-client"><b>${t}</b><div class="mut" style="margin-top:4px">${c}</div></div>`;
  $('main').innerHTML=`<div class="panel"><h3>ניתוח חכם — 12 חודשים אחרונים</h3>
  ${high.length?li('🏆 מנועי הרווח שלך',high.slice(0,5).map(x=>`${esc(x.n)} — רווח ${NIS(x.profit)} ₪ (${(x.marg*100).toFixed(0)}%)`).join('<br>')):''}
  ${low.length?li('⚠️ לקוחות עם רווחיות נמוכה מ-35% — שקול תמחור מחדש',low.slice(0,5).map(x=>`${esc(x.n)} — ${(x.marg*100).toFixed(0)}% בלבד (רווח ${NIS(x.profit)} ₪)`).join('<br>')):''}
  ${debt.length?li('💰 חובות מצטברים לגבייה',debt.slice(0,6).map(x=>`${esc(x.n)} — ${NIS(x.inc-x.paid)} ₪ פתוחים`).join('<br>')):''}
  ${(()=>{const cur=DB.settings.current_month||monthLabels().at(-1);
    const inMonth=new Set(entriesOf(cur).map(e=>e.client_name));
    const missing=DB.clients.filter(c=>c.active&&(+c.retainer>0)&&!inMonth.has(c.name));
    return missing.length?li('🚨 לקוחות פעילים שלא נכנסו לחודש '+cur,missing.map(c=>esc(c.name)+' — ריטיינר '+NIS(c.retainer)+' ₪').join('<br>')):'';})()}
  ${li('📈 תחזית חודש הבא',(()=>{const base=DB.clients.filter(c=>c.active).reduce((a,c)=>a+(+c.retainer||0),0);
    const pipe=DB.pipeline.reduce((a,p)=>a+(+p.amount||0)*(PROBW[p.prob]||0.5),0);
    return `בסיס ריטיינרים: ${NIS(base)} ₪ · צבר משוקלל: ${NIS(pipe)} ₪ · יחד: <b>${NIS(base+pipe)} ₪</b>`;})())}
  ${li('🎯 שעות מעצבים',DB.team.filter(t=>['מעצב','צלם'].includes(t.kind)&&t.active).map(t=>{
    const gap=(+t.bill_rate||0)-(+t.cost_rate||0);
    return `${esc(t.name)}: עלות ${NIS(t.cost_rate)} ₪ → חיוב ${NIS(t.bill_rate)} ₪ = <b class="${gap>0?'pos':'negv'}">${NIS(gap)} ₪ רווח לשעה</b>${(+t.bill_rate)?'':' — <span class="warn">חסר תעריף חיוב!</span>'}`;}).join('<br>')||'הגדר תעריפים בטאב צוות וספקים')}
  </div>`;
}

async function importCsv(){
  const f=$('csvFile').files[0];if(!f){toast('בחר קובץ');return;}
  const txt=await f.text();
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const sep=lines[0].includes('\t')?'\t':',';
  let ok=0,skip=0;
  for(const line of lines.slice(1)){
    const p=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    const name=p[0];if(!name){skip++;continue;}
    const ex=DB.entries.find(e=>e.month_label===CURMONTH&&e.client_name===name);
    const vals={retainer:+p[1]||0,shooting:+p[2]||0,design:+p[3]||0};
    if(ex){await upd('entries',ex.id,vals);}
    else{await ins('entries',{month_label:CURMONTH,client_name:name,...vals,updated_by:ME?.email||''});}
    ok++;
  }
  $('csvMsg').textContent=`יובאו ${ok} שורות${skip?` (דולגו ${skip})`:''}`;toast('הייבוא הושלם');
}
function downloadConfigured(){
  let html=document.documentElement.outerHTML;
  html=html.replace(/const BAKED=\{url:"[^"]*",key:"[^"]*"\}/,
    `const BAKED={url:"${CFG.url}",key:"${CFG.key}"}`);
  const blob=new Blob(['<!DOCTYPE html>\n'+html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='BABAMARK_מערכת.html';a.click();toast('הקובץ ירד — שלח אותו לצוות');
}
function copyCfgLink(){
  const h='#cfg='+btoa(JSON.stringify(CFG));
  navigator.clipboard.writeText(location.origin+location.pathname+h);
  toast('הקישור הועתק');
}
function downloadBackup(){

}

const fmtC=(n,c)=>NIS(n)+' '+(CURR[c]||'₪');
const INV_ST=['יש חשבונית','אין','טרם הופקה','שולם פרטי','לא שולם'];
const INV2=['','יש','אין','טרם הופקה'];
const PAY2=['','שולם','לא שולם','שולם פרטי'];
function actNorm(a){
  if(a.inv!=null||a.pay!=null)return{inv:a.inv||'',pay:a.pay||''};
  const v=a.invoice||'';
  if(v==='יש חשבונית')return{inv:'יש',pay:''};
  if(v==='טרם הופקה')return{inv:'טרם הופקה',pay:''};
  if(v==='שולם פרטי')return{inv:'',pay:'שולם פרטי'};
  if(v==='לא שולם')return{inv:'',pay:'לא שולם'};
  if(v==='אין')return{inv:'אין',pay:''};
  return{inv:'',pay:''};
}
const DEF_CATS=['SOCIAL & DIGITAL','RETAIL & POS','INFLUENCERS','PARTNER','GWP','ACTIVATION','EVENTS','צוות צילום','פוסט','לוגיסטיקה','קופה קטנה','כללי'];
/* v7.3: עדכונים/חריגות מאושרות לסעיף (l.changes) + פירוט פנימי לספקי-משנה (l.subs) */
const lineChanges=l=>(l.changes||[]);
const subsCost=l=>(l.subs||[]).reduce((a,x)=>a+(+x.cost||0),0);
/* עלות הסעיף = התחזית המאושרת (+ עדכונים). הפירוט הפנימי הוא מידע לצידה, לא מחליף אותה */
const lineBudget=l=>(+l.budget||0)+lineChanges(l).reduce((a,c)=>a+(+c.cost||0),0);
const lineBase=(p,l)=>(l.charge!=null&&l.charge!=='')?+l.charge:(+l.budget||0)*(1+((+p.fee_pct||0)/100));
const lineCharge=(p,l)=>lineBase(p,l)+lineChanges(l).reduce((a,c)=>a+(+c.charge||0),0);
const newSubId=()=>'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
/* עלות של שורת הוצאה: 'פנימי' (עבודה שלנו) = 0 — נשאר ביומן לתיעוד, לא יורד מהרווח */
const costOf=a=>a.internal?0:(+a.amount||0);
const subActual=(p,lid,sid)=>(p.actuals||[]).filter(a=>a.line_id===lid&&a.sub_id===sid).reduce((s,a)=>s+costOf(a),0);
const lineActualNoSub=(p,l)=>(p.actuals||[]).filter(a=>a.line_id===l.id&&!(l.subs||[]).some(x=>x.id===a.sub_id)).reduce((s,a)=>s+costOf(a),0);

  desc:['סעיף','משימה','אלמנט','תיאור','פירוט','מה','item','description','task','element','שם','פריט','הוצאה','ספק/תיאור'],
  content:['תוכן','content','details','מפרט'],

  qty:['כמות','qty','quantity','יח'],
  unit:['ליחידה','מחיר יח','unit','per unit','מחיר'],
  budget:['תקציב','budget','net net','net','עלות','cost','סה"כ','סה״כ','סהכ','total','סכום','amount','price wo','price w/o','ללא מע','מחיר'],
  charge:['ללקוח','for customer','customer','client price','חיוב','sell','מכירה','retail price','חויב','billed','invoice'],
  actual:['בפועל','actual','paid','שולם','יצא','spent','real'],

function pimpFindHeader(aoa,mode){

  if(map.desc==null&&aoa){const cnt=hdr.map((_,idx)=>used.has(idx)?-1:aoa.slice(hRow+1,hRow+60).filter(r=>typeof (r||[])[idx]==='string'&&pimpNorm(r[idx])).length);
    const mx=Math.max(...cnt);if(mx>=2){const i=cnt.indexOf(mx);map.desc=i;used.add(i);
      /* עמודה טקסטואלית דלילה משמאל לתיאור — קטגוריה (תאים ממוזגים) */
      if(map.cat==null){for(let j=0;j<i;j++){if(used.has(j))continue;const c=aoa.slice(hRow+1,hRow+60).filter(r=>typeof (r||[])[j]==='string'&&pimpNorm(r[j])).length;if(c>=1&&c<mx){map.cat=j;used.add(j);break;}}}}}

/* ---------- קבלה בתמונה → OCR → "למה לשייך?" ---------- */
/* העלאת קובץ קבלה ל-Storage; מחזיר URL ציבורי */
async function receiptStore(p,file){
  const path=p.id+'/'+Date.now()+'_'+file.name.replace(/[^\w.\-]+/g,'_');
  const {error}=await sb.storage.from('receipts').upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=sb.storage.from('receipts').getPublicUrl(path);return data?.publicUrl||'';
}
/* קריאת סכום מקבלה (OCR) — מחזיר null אם לא זמין */
async function receiptOcr(p,file){
  try{let b64=null;
    if(/^image\//.test(file.type))b64=await shrinkImage(file,1600);
    else if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>8*1024*1024)return null;
      b64={type:'application/pdf',data:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);})};}
    if(!b64)return null;
    const {data,error}=await sb.functions.invoke('receipt-ocr',{body:{image_base64:b64.data,media_type:b64.type,hint_lines:[]}});
    if(error||!data?.success)return null;return data;
  }catch(e){return null;}
}
/* נרמול: מעביר receipt_url ישן לתוך receipts[] כדי שיהיה לו סכום */
function receiptsNormalize(x){x.receipts=x.receipts||[];if(x.receipt_url){if(!x.receipts.some(r=>r.url===x.receipt_url))x.receipts.unshift({url:x.receipt_url,name:''});delete x.receipt_url;}return x.receipts;}
const receiptsSum=a=>actReceipts(a).reduce((t,r)=>t+(+r.amount||0),0);
const receiptsHaveAmt=a=>actReceipts(a).some(r=>r.amount!=null&&r.amount!=='');
async function receiptSetVat(pid,i,j,val){
  const p=prodn(pid);const a=structuredClone(p.actuals||[]);const x=a[i];if(!x)return;
  const r=receiptsNormalize(x)[+j];if(!r)return;r.vat=val===''?null:val==='1';
  await upd('productions',pid,{actuals:a});renderProd();receiptsPopover(pid,i);
}
/* קובע את סכום השורה לפי הקבלות: עם מע״מ → מחלקים ב-1.18, בלי → כמו שהוא. מעורב → נשמר גם סך ששולם */
async function receiptsApplyToRow(pid,i){
  const p=prodn(pid);const k=prodCalc(p);const a=structuredClone(p.actuals||[]);const x=a[i];if(!x)return;
  const rs=receiptsNormalize(x).filter(r=>r.amount!=null&&r.amount!=='');if(!rs.length)return;
  const vatOf=r=>r.vat==null?!x.novat:!!r.vat;
  const cost=rs.reduce((t,r)=>t+(vatOf(r)?(+r.amount)/(1+k.vrate):+r.amount),0);const paid=rs.reduce((t,r)=>t+(+r.amount),0);
  const anyVat=rs.some(vatOf),allVat=rs.every(vatOf);
  x.amount=Math.round(cost*100)/100;if(!anyVat)x.novat=true;else delete x.novat;
  if(anyVat&&!allVat)x.paid_total=paid;else delete x.paid_total;
  await upd('productions',pid,{actuals:a});closeModal();renderProd();toast('השורה עודכנה: עלות '+NIS(x.amount)+(x.paid_total?' · שולם '+NIS(paid)+' (מעורב עם/בלי מע״מ)':''),4500);
}
async function receiptSetAmount(pid,i,url,val){
  const p=prodn(pid);const a=structuredClone(p.actuals||[]);const x=a[i];if(!x)return;
  const rs=receiptsNormalize(x);const r=rs[+url];if(!r)return;

/* כמה שילמנו בפועל (כולל מע״מ) על שורת הוצאה: ללא מע״מ = הסכום עצמו; יש paid_total (מתוך קבלות מעורבות) = הוא */
const actInc=(a,vrate)=>a.internal?0:(a.paid_total!=null&&a.paid_total!==''?+a.paid_total:(a.novat?(+a.amount||0):(+a.amount||0)*(1+(vrate||0))));
/* כל הקבלות של שורת הוצאה: receipt_url הישן + מערך receipts */
const actReceipts=a=>{const r=[];if(a.receipt_url)r.push({url:a.receipt_url,name:''});(a.receipts||[]).forEach(x=>{if(x&&x.url&&!r.some(y=>y.url===x.url&&(y.name||'')===(x.name||'')))r.push(x);});return r;};
async function receiptRemove(pid,i,j){

/* צירוף קבלה לשורת הוצאה קיימת — בלי OCR, רק שמירה וקישור */

/* הורדת קבלות כ-ZIP: mode 'sel' = מסומנות · 'all' = כל המוצגות (אחרי סינון) */
async function receiptsZip(pid,mode){
  const p=prodn(pid);if(!p)return;
  const all=(p.actuals||[]);let idx;
  if(mode==='sel'){idx=[...document.querySelectorAll('.rcv_ck:checked')].map(c=>+c.dataset.i);if(!idx.length){toast('סמן שורות קודם (עמודה ראשונה)');return;}}
  else{idx=[...document.querySelectorAll('.rcv_ck')].map(c=>+c.dataset.i);}
  const rows=[];idx.forEach(i=>{const a=all[i];if(!a)return;actReceipts(a).forEach((r,j)=>rows.push({i,a,url:r.url,j,cnt:actReceipts(a).length}));});
  if(!rows.length){toast('אין קבלות מצורפות בשורות שנבחרו');return;}
  if(!window.JSZip){toast('טוען…');await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('JSZip'));document.head.appendChild(s);}).catch(()=>{toast('לא הצלחתי לטעון את רכיב ה-ZIP');});if(!window.JSZip)return;}

  const index=[['#','תאריך','ספק','תיאור','סכום לפני מע״מ','מי שילם','קובץ','קישור']];let ok=0,fail=[];let n=0;const seenRow=new Set();

    let name=`${String(n).padStart(2,'0')}_${safe(a.supplier)||'ספק'}_${safe(a.desc)||'הוצאה'}_${Math.round(+a.amount||0)}${cnt>1?'_'+String.fromCharCode(97+j):''}`;
    try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);const b=await r.blob();
      let ext=(url.split('?')[0].match(/\.(pdf|jpe?g|png|heic|webp|gif)$/i)||[])[1]||({'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[b.type]||'bin');
      zip.file(name+'.'+ext.toLowerCase(),b);ok++;index.push([n,a.date||'',a.supplier||'',a.desc||'',Math.round(+a.amount||0),a.paid_by||'',name+'.'+ext,url]);}
    catch(e){fail.push({a,url});index.push([n,a.date||'',a.supplier||'',a.desc||'',Math.round(+a.amount||0),a.paid_by||'','— לא ירד (קישור חיצוני)',url]);}

  const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download=`קבלות_${safe(p.name)}_${new Date().toISOString().slice(0,10)}.zip`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);

async function receiptUpload(id,file){

  try{

      if(file.size>8*1024*1024)throw new Error('PDF גדול מ-8MB');

  }
  if(url){$('qeUrl').value=url;$('qeUrl').dataset.ocrTotal=ocr?.total!=null?String(ocr.total):'';$('qeUrl').dataset.ocrName=file.name||'';
    $('qeUrl').dataset.ocrVat=ocr?.vat!=null&&+ocr.vat>0?'1':(ocr?.total!=null?'0':'');

function shrinkImage(file,max){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const d=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);res({type:'image/jpeg',data:d.split(',')[1]});};
  img.onerror=()=>rej(new Error('לא ניתן לקרוא את התמונה'));img.src=u;});}

/* ---------- סטטוס הפקה: תחזית מול בפועל, זליגות, צפי סיום (v5.0) ---------- */
function lineActual(p,lineId){return (p.actuals||[]).filter(a=>a.line_id===lineId).reduce((s,a)=>s+costOf(a),0);}
function prodStatus(p){
  const k=prodCalc(p);const lines=p.lines||[],acts=p.actuals||[];
  const L=lines.map(l=>{const ac=lineActual(p,l.id);const b=lineBudget(l);const rem=b-ac;const pct=b?ac/b:(ac?Infinity:0);
    const n=acts.filter(a=>a.line_id===l.id).length;
    const st=ac===0?'idle':pct>1.005?(l.overage_ok?'billable':'over'):pct>=0.85?'near':'ok';
    return{l,budget:b,actual:ac,rem,pct,n,st};});
  const unalloc=acts.filter(a=>!a.line_id||!lineOf(p,a.line_id));
  const unallocSum=unalloc.reduce((s,a)=>s+(+a.amount||0),0);
  const over=L.filter(x=>x.st==='over').sort((a,b)=>a.rem-b.rem);
  /* חריגות שהלקוח אישר מראש לחיוב בנפרד — לא זליגה; ממתינות לרישום כעדכון + PO */
  const billable=L.filter(x=>x.st==='billable').map(x=>{const extra=-x.rem;const fee=+x.l.overage_fee||0;return{...x,extra,charge:Math.round(extra*(1+fee/100)),fee};});const billableSum=billable.reduce((s,x)=>s+x.charge,0);
  const overSum=over.reduce((s,x)=>s+(-x.rem),0);
  const idle=L.filter(x=>x.st==='idle');
  const idleSum=idle.reduce((s,x)=>s+x.budget,0);
  /* צפי סיום: כל סעיף — הגבוה מבין תקציב/בפועל (מניחים שסעיפים שלא נוצלו עוד ינוצלו) + הוצאות לא משויכות */
  const projected=L.reduce((s,x)=>s+Math.max(x.budget,x.actual),0)+unallocSum;
  const committed=k.actual;                      /* מה שכבר יצא */
  const projFee=projected*((+p.fee_pct||0)/100);
  const billing=k.billing;                       /* מה שהלקוח משלם: חשבונית סופית / מחיר מאושר + חריגות / PO */
  const projProfit=billing-projected;
  const byCat={};
  L.forEach(x=>{const c=x.l.cat||'כללי';const g=byCat[c]=byCat[c]||{fc:0,ac:0,lines:0,over:0,ap:0,ch:0};g.fc+=x.budget;g.ac+=x.actual;g.ap+=linePreFee(p,x.l);g.ch+=lineCharge(p,x.l);g.lines++;if(x.st==='over')g.over++;});
  unalloc.forEach(a=>{const c=a.cat||'לא משויך';const g=byCat[c]=byCat[c]||{fc:0,ac:0,lines:0,over:0,ap:0,ch:0};g.ac+=(+a.amount||0);});
  return{k,L,unalloc,unallocSum,over,overSum,idle,idleSum,projected,committed,projFee,billing,projProfit,byCat,billable,billableSum};
}

function exportProdCsv(id){

  const k=prodCalc(p);
  const acAll=p.actuals||[];
  const inRange=a=>{const ex=+a.amount||0,inc=actInc(a,k.vrate);
    if(PRODF.min!==''&&ex<+PRODF.min&&inc<+PRODF.min)return false;
    if(PRODF.max!==''&&ex>+PRODF.max&&inc>+PRODF.max)return false;return true;};
  const rows=acAll.filter(a=>{
    const st=actNorm(a);
    if(PRODF.cat&&(a.cat||'ללא קטגוריה')!==PRODF.cat)return false;
    if(PRODF.inv&&st.inv!==PRODF.inv)return false;
    if(PRODF.pay){if(PRODF.pay==='__none'){if(st.pay)return false;}else if(st.pay!==PRODF.pay)return false;}
    if(!inRange(a))return false;
    if(PRODF.q){const q=PRODF.q.toLowerCase();
      if(!((a.desc||'')+' '+(a.supplier||'')+' '+(a.who||'')).toLowerCase().includes(q))return false;}
    return true;});
  const head=['מה','ספק','קטגוריה','עלות ללא מע"מ','עלות כולל מע"מ','חיוב ללקוח','מרווח','מי','חשבונית','תשלום','הערה'];
  const lines=rows.map(a=>{const st=actNorm(a);const chg=(a.charge!=null&&a.charge!==''?+a.charge:(+a.amount||0));
    return [a.desc||'',a.supplier||'',a.cat||'',(+a.amount||0).toFixed(2),actInc(a,k.vrate).toFixed(2),
      chg.toFixed(2),(chg-(+a.amount||0)).toFixed(2),a.who||'',st.inv||'',st.pay||'',(a.note||'').replace(/"/g,"'")]
    .map(x=>`"${x}"`).join(',');});
  const tot=rows.reduce((a,x)=>a+(+x.amount||0),0);
  const csv='\ufeff'+head.map(h=>`"${h}"`).join(',')+'\n'+lines.join('\n')
    +'\n'+`"סה\"כ","","","${tot.toFixed(2)}","${(tot*(1+k.vrate)).toFixed(2)}","","","","","",""`;
  const el=document.createElement('a');
  el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  el.download=(p.name||'הפקה').replace(/[\/\\:]/g,'-')+'_יומן.csv';el.click();
  toast('יוצא '+rows.length+' שורות');
}

async function poInvoice(pid,i,kind,pct,amtOverride,docType){
  const p=prodn(pid);const o=(p.pos||[])[i];if(!o)return;
  if(!p.client_name){toast('בחר לקוח להפקה קודם');return;}
  const invd=(o.invoices||[]).reduce((a,x)=>a+(+x.amount||0),0);const total=+o.amount||0;
  let amt,kindTxt;pct=+pct||0;
  if(kind==='advance'){amt=Math.round(total*pct/100);kindTxt='מקדמה '+pct+'%';}
  else if(kind==='rest'){amt=Math.round(total-invd);kindTxt='יתרה';pct=Math.round(amt/total*100);}
  else{amt=total;kindTxt='תשלום מלא';pct=100;}
  if(amtOverride)amt=amtOverride;
  if(amt<=0){toast('אין מה לחייב');return;}
  const m=CURMONTH||p.month_label;if(!m){toast('בחר חודש');return;}
  let e=DB.entries.find(x=>x.month_label===m&&x.client_name===p.client_name);
  if(!e){const c=DB.clients.find(x=>x.name===p.client_name);
    e=await ins('entries',{month_label:m,client_name:p.client_name,retainer:0,shooting:0,design:0,status:'no',paid_amt:0,note:'',work_type:c?.pkg||'',vat:c?.vat!=null?+c.vat:null,currency:'ILS',ils_rate:1,team:[],addons:[],work_lines:[],updated_by:ME?.email||''});if(!e)return;}
  const desc=kindTxt+' · PO '+o.number+' · '+p.name;
  ezModal(e.id,{docType:docType||305,po:{prod_id:pid,idx:i,kind,pct,amount:amt,number:o.number,kindTxt,addon_desc:desc,label:p.name+(o.desc?' — '+o.desc:'')+' · '+kindTxt}});
}
/* הזמנת רכש מקובץ: HTML של Ariba נקרא מקומית; PDF/תמונה — דרך receipt-ocr */
async function poFromFile(pid,file){
  const p=prodn(pid);if(!p||!file)return;
  let po=null;
  try{
    if(/\.html?$/i.test(file.name)||file.type==='text/html'){
      const t=(await file.text()).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');
      const num=(t.match(/Order No\.?\s*([0-9]{6,})/i)||[])[1]||'';
      const amt=(t.match(/Total Amount\s*([\d,]+\.?\d*)\s*ILS/i)||[])[1]||'';
      const who=(t.match(/Created on [^b]+ by ([A-Za-z\u0590-\u05FF .'-]+?)\s+(Supplier|Order)/i)||[])[1]||(t.match(/Requester:\s*([A-Za-z\u0590-\u05FF .'-]+?)\s+PR No/i)||[])[1]||'';
      const dt=(t.match(/Issued on \w+, (\w+ \d{1,2}, \d{4})/i)||[])[1]||'';
      const desc=(t.match(/Full Description:\s*(.+?)\s+Req\. Line/i)||[])[1]||'';
      po={number:num,amount:+amt.replace(/,/g,'')||0,contact:who.trim(),date:dt?new Date(dt).toISOString().slice(0,10):todayISO(),desc:desc.trim()};
    }else{
      toast('קורא את ההזמנה…');
      let b64;if(/^image\//.test(file.type))b64=await shrinkImage(file,1600);
      else b64={type:'application/pdf',data:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);})};
      const {data,error}=await sb.functions.invoke('receipt-ocr',{body:{image_base64:b64.data,media_type:b64.type,mode:'po'}});
      if(error)throw error;if(!data?.success)throw new Error(data?.errMsg||'קריאה נכשלה');
      po={number:data.po_number||data.doc_number||'',amount:+data.total||0,contact:data.contact||data.supplier||'',date:data.date||todayISO(),desc:data.description||''};
    }
  }catch(e){toast('לא הצלחתי לקרוא: '+(e.message||e)+' — הוסף ידנית');console.warn(e);return;}
  if(!po.number&&!po.amount){toast('לא זוהתה הזמנת רכש בקובץ');return;}
  if((p.pos||[]).some(o=>o.number===po.number)){toast('הזמנה '+po.number+' כבר קיימת');return;}
  if(!confirm('להוסיף הזמנת רכש?\n\nמספר: '+po.number+'\nסכום: '+NIS(po.amount)+' ₪ לפני מע״מ\nאיש קשר: '+po.contact+'\nתאריך: '+po.date+'\nתיאור: '+po.desc))return;
  await upd('productions',pid,{pos:[...(p.pos||[]),{...po,inv:'טרם',src:file.name}]});toast('הזמנה '+po.number+' נוספה ✓');renderProd();
}

async function poRecordTax(pid,pos,i,x){

  const desc=kindTxt+' · PO '+o.number+' · '+p.name;

  await ins('invoices',{month_label:x.month,client_name:p.client_name+' · PO '+o.number+' · '+kindTxt,status:'הופקה',number:x.doc||'',pdf_link:x.pdf||'',doc_number:x.doc||'',amount:Math.round(x.amount*(1+vr)*100)/100});
  o.invoices=[...(o.invoices||[]),{kind:x.kind,pct:x.pct,amount:x.amount,doc:x.doc||'',pdf:x.pdf||'',date:x.date,entry_id:e.id,month:x.month,manual:true}];
  const paid=o.invoices.reduce((a,y)=>a+(+y.amount||0),0);o.inv=paid>=(+o.amount||0)-1?'הופקה':'מקדמה';o.inv_number=x.doc||'';
  await upd('productions',pid,{pos});closeModal();toast('נרשם ✓ · נכנס לחודש '+heLabel(x.month));renderProd();
}
async function poProformaToInvoice(pid,i,j){
  const p=prodn(pid);const o=(p.pos||[])[i];const pf=(o?.proformas||[])[j];if(!pf)return;
  modal(`<h3>חשבון עסקה #${esc(pf.doc)} → חשבונית מס</h3>
  <p class="mut">${esc(p.name)} · PO ${esc(o.number)} · ${NIS(pf.amount)} ₪ לפני מע״מ</p>
  <div class="row" style="margin-top:14px;gap:8px">
    <button class="btn green" onclick="closeModal();poInvoice(${pid},${i},'${pf.kind||'advance'}',${+pf.pct||0},${+pf.amount},305).then(()=>{EZOPT&&EZOPT.po&&(EZOPT.po.fromProforma=${j});})">⚡ הפק חשבונית מס ב-EZcount</button>
    <button class="btn gray" onclick="closeModal();poProformaManual(${pid},${i},${j})">✎ כבר הוצאתי — רשום מספר</button>
    <button class="btn gray" onclick="closeModal()">ביטול</button></div>`);
}
async function poProformaManual(pid,i,j){
  const p=prodn(pid);const pos=structuredClone(p.pos||[]);const o=pos[i];const pf=(o.proformas||[])[j];if(!pf)return;
  const doc=prompt('מספר חשבונית המס שיצאה על חשבון העסקה #'+pf.doc+':','');if(doc==null)return;
  const m=prompt('לאיזה חודש להכניס? ('+monthLabels().join(' / ')+')',CURMONTH||p.month_label);if(!m||!monthLabels().includes(m)){toast('חודש לא תקין');return;}
  o.proformas.splice(j,1);
  await poRecordTax(pid,pos,i,{doc:doc.trim(),amount:pf.amount,date:todayISO(),kind:pf.kind||'advance',pct:Math.round(pf.amount/(+o.amount||1)*100),pdf:pf.pdf||'',month:m});
}
/* חשבונית שבוטלה/נמחקה באיזיקאונט — מסירים אותה מהמערכת: מההזמנה, מהתוספת בכרטיס החודש ומהגבייה */
async function poInvoiceRemove(pid,i,j){
  const p=prodn(pid);const pos=structuredClone(p.pos||[]);const o=pos[i];const x=(o?.invoices||[])[j];if(!x)return;
  if(!confirm('להסיר את חשבונית #'+(x.doc||'')+' ('+NIS(x.amount)+' ₪) מהמערכת?\nזה לא מבטל אותה באיזיקאונט — רק מנקה כאן, אחרי שביטלת/מחקת שם.'))return;
  const kindTxt=x.kind==='advance'?'מקדמה '+x.pct+'%':x.kind==='rest'?'יתרה':'תשלום מלא';
  const desc=kindTxt+' · PO '+o.number+' · '+p.name;
  const e=DB.entries.find(r=>r.id===x.entry_id)||DB.entries.find(r=>r.month_label===x.month&&r.client_name===p.client_name);
  if(e){const addons=(e.addons||[]).filter(a=>a.desc!==desc);if(addons.length!==(e.addons||[]).length)await upd('entries',e.id,{addons});}
  const inv=DB.invoices.find(v=>v.month_label===x.month&&v.client_name===p.client_name+' · PO '+o.number+' · '+kindTxt);
  if(inv)await del('invoices',inv.id);
  o.invoices.splice(j,1);const paid=o.invoices.reduce((a,y)=>a+(+y.amount||0),0);o.inv=!o.invoices.length?'טרם':paid>=(+o.amount||0)-1?'הופקה':'מקדמה';o.inv_number=o.invoices.at(-1)?.doc||'';
  await upd('productions',pid,{pos});toast('הוסר');renderProd();
}
async function poAdd(id){const p=prodn(id);const number=prompt('מספר הזמנת רכש:');if(number==null)return;
  const amount=+String(prompt('סכום לפני מע״מ:','')||'').replace(/[^\d.]/g,'')||0;
  await upd('productions',id,{pos:[...(p.pos||[]),{number:number.trim(),amount,desc:'',contact:'',date:todayISO(),inv:'טרם'}]});renderProd();}
async function poSet(id,i,f,v){const p=prodn(id);const a=structuredClone(p.pos||[]);a[i][f]=f==='amount'?(+String(v).replace(/[^\d.\-]/g,'')||0):v;await upd('productions',id,{pos:a});renderProd();}
async function poDel(id,i){const p=prodn(id);if(!confirm('להסיר את הזמנת הרכש?'))return;const a=structuredClone(p.pos||[]);a.splice(i,1);await upd('productions',id,{pos:a});renderProd();}
async function prodnToMonth(id){
  const p=prodn(id);const k=prodCalc(p);
  let rate=1;
  if(p.currency&&p.currency!=='ILS'){
    const r=prompt('שער המרה לש״ח (למשל 4.0 ליורו):','4.0');
    if(!r)return;rate=+r||1;
  }
  let e=DB.entries.find(x=>x.month_label===p.month_label&&x.client_name===p.client_name);
  if(!e){e=await ins('entries',{month_label:p.month_label,client_name:p.client_name,updated_by:ME?.email||''});if(!e)return;}
  const tag='הפקה · '+p.name;
  let addons=structuredClone(e.addons||[]).filter(a=>(a.desc||'')!==tag&&!(a.desc||'').startsWith(tag+' · PO '));
  const pos=(p.pos||[]).filter(o=>+o.amount);
  if(pos.length){
    /* כל הזמנת רכש = תוספת נפרדת → שורה נפרדת בחשבונית עם מספר ההזמנה */
    const costEach=Math.round(k.actual*rate/pos.length);
    pos.forEach((o,i)=>{const invd=(o.invoices||[]).reduce((a,x)=>a+(+x.amount||0),0);const rem=Math.max(0,+o.amount-invd);
      addons.push({desc:tag+' · PO '+o.number+(o.desc?' · '+o.desc:'')+(invd?' (אחרי חשבוניות '+NIS(invd)+')':''),charge:Math.round(rem*rate),cost:i===pos.length-1?Math.round(k.actual*rate)-costEach*(pos.length-1):costEach,po:o.number});});
  }else addons.push({desc:tag,charge:Math.round(k.billing*rate),cost:Math.round(k.actual*rate)});
  await upd('entries',e.id,{addons});
  toast('ההפקה שויכה לחודש '+p.month_label+(pos.length?' · '+pos.length+' הזמנות רכש':''));
}

/* ================= realtime sync ================= */
function startRealtime(){
  try{
    sb.channel('db-changes').on('postgres_changes',{event:'*',schema:'public'},async()=>{
      await loadAll();
      if(document.querySelector('.modal-bg'))return;
      if(document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
      if(CUR==='productions'&&PRODV)renderProd();else render();
    }).subscribe();
  }catch(e){console.warn('realtime off',e);}
}

/* ================= client 360 ================= */
let chC360=null;
function openC360(name){
  const ents=DB.entries.filter(e=>e.client_name===name)
    .map(e=>({e,k:calc(e),ord:(DB.months.find(m=>m.label===e.month_label)||{}).ord||0}))
    .sort((a,b)=>a.ord-b.ord);
  if(!ents.length){toast('אין נתונים');return;}
  const c=DB.clients.find(x=>x.name===name);
  const cur=ents.at(-1).e.currency||'ILS';const sym=CURR[cur]||'₪';
  let rev=0,profit=0,paid=0,bal=0;
  ents.forEach(({k})=>{rev+=k.exVat;profit+=k.profit;paid+=k.paid;bal+=k.balance;});
  const active=ents.filter(({k})=>k.exVat>0);
  const avg=active.length?rev/active.length:0;
  const last12=ents.slice(-12);
  modal(`<h3 style="display:flex;justify-content:space-between;align-items:center">
    <span>${esc(name)}</span>
    <span class="pill ${c?.active?'g':'gr'}">${c?.active?'לקוח פעיל':'לא פעיל'}</span></h3>
  <p class="mut" style="margin-bottom:10px">${esc(c?.pkg||'')} ${c?.retainer?'· ריטיינר '+NIS(c.retainer)+' '+sym:''} · ${ents.length} חודשי פעילות</p>
  <div class="cards" style="grid-template-columns:repeat(2,1fr)">
    ${card('סה״כ הכנסות (לפני מע״מ)',NIS(rev)+' '+sym)}
    ${showProfit()?card('סה״כ רווח',NIS(profit)+' '+sym+' · '+(rev?(profit/rev*100).toFixed(0):0)+'%','profit'):card('נגבה',NIS(paid)+' '+sym,'profit')}
    ${card('ממוצע חודשי',NIS(avg)+' '+sym)}
    ${card('יתרה פתוחה',NIS(bal)+' '+sym,bal>1?'out':'')}
  </div>
  <div class="chartbox" style="height:180px;margin:6px 0 10px"><canvas id="c360c"></canvas></div>
  <div class="tblwrap" style="max-height:220px;overflow-y:auto"><table class="tbl"><thead><tr>
    <th>חודש</th><th>חיוב</th>${showProfit()?'<th>רווח</th>':''}<th>שולם</th><th>יתרה</th></tr></thead><tbody>
    ${[...ents].reverse().slice(0,18).map(({e,k})=>`<tr>
      <td>${heLabel(e.month_label)}</td><td class="num">${NIS(k.exVat)}</td>
      ${showProfit()?`<td class="num ${k.profit<0?'negv':'pos'}">${NIS(k.profit)}</td>`:''}
      <td class="num">${NIS(k.paid)}</td><td class="num ${k.balance>1?'warn':''}">${NIS(k.balance)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:12px;justify-content:space-between">
    ${canEdit()&&c?`<button class="btn sm" onclick="closeModal();tab('clients');openClient(${c.id})">ערוך פרופיל</button>`:'<span></span>'}
    <button class="btn gray" onclick="closeModal()">סגור</button>
  </div>`);
  if(chC360)chC360.destroy();
  const ds=[{label:'חיוב',data:last12.map(x=>x.k.exVat),backgroundColor:'#1c2af0'}];
  if(showProfit())ds.push({label:'רווח',data:last12.map(x=>x.k.profit),backgroundColor:'#2e7d32'});
  chC360=new Chart($('c360c'),{type:'bar',data:{labels:last12.map(x=>heLabel(x.e.month_label)),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}}}}});
}

/* ================= tooltip engine ================= */
(function(){const tb=document.createElement('div');tb.className='tipbox hidden';document.body.appendChild(tb);
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(t&&t.dataset.tip){tb.textContent=t.dataset.tip;tb.classList.remove('hidden');
    const r=t.getBoundingClientRect();
    tb.style.top=Math.min(r.bottom+8,window.innerHeight-140)+'px';
    tb.style.left=Math.max(150,Math.min(r.left+r.width/2,window.innerWidth-150))+'px';}
  else tb.classList.add('hidden');});
document.addEventListener('scroll',()=>tb.classList.add('hidden'),true);})();

/* ================= boot ================= */
(async function boot(){
  if(!CFG){$('setupScreen').classList.remove('hidden');return;}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  await maybeRecovery();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    $('authScreen').classList.remove('hidden');
    if(INVITE){
      toggleSignup(true);
      $('suName').value=INVITE.name||'';
      $('suEmail').value=INVITE.email||'';
      document.querySelector('#signupForm .btn').textContent='הצטרפות ל-babamark';
    }
    return;
  }
  $('loader').classList.remove('hidden');
  const {data:pf}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  ME=pf||{id:session.user.id,email:session.user.email};
  MYROLE=pf?.role||'manager';
  await loadAll();
  $('loader').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('userName').textContent=ME.name||ME.email;
  $('userDot').textContent=(ME.name||ME.email||'?')[0].toUpperCase();
  if(MYROLE==='bookkeeping')CUR='invoices';
  if(MYROLE==='project')CUR='productions';
  renderShell();render();startRealtime();
  if(location.protocol.startsWith('http')&&canEdit()){
    const cur=location.origin+location.pathname;
    if(DB.settings.site_url!==cur){
      try{await sb.from('settings').upsert({key:'site_url',value:cur});DB.settings.site_url=cur;}catch(e){}
    }
  }
})();
</script>
